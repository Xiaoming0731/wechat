# 容器版 nginx：后端用 docker compose 的服务名
include /etc/nginx/modules-enabled/*.conf;

# 只开一个 worker：保证轮询计数器唯一，连接才会严格在 chat1/chat2 之间交替
worker_processes 1;

events {
    worker_connections 1024;
}

stream {
    upstream chatserver {
        server chat1:6000 max_fails=3 fail_timeout=30s;
        server chat2:6000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;              # 客户端连这个端口
        proxy_pass chatserver;
        proxy_connect_timeout 1s;
        proxy_timeout 300s;       # 长连接：5 分钟无数据才断开
    }
}
