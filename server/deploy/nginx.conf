# 加载动态模块（stream 模块靠这行才能用）
include /etc/nginx/modules-enabled/*.conf;

# 只开一个 worker：保证轮询计数器唯一，连接才会严格在 6001/6002 之间交替
worker_processes 1;

events {
    worker_connections 1024;
}

stream {
    # 后端聊天服务器集群：两个实例，nginx 按连接轮流分发
    upstream chatserver {
        server 127.0.0.1:6001 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6002 weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;              # 客户端连这个端口
        proxy_pass chatserver;
        proxy_connect_timeout 1s;
        proxy_timeout 300s;       # 长连接：5 分钟无数据才断开
    }
}

